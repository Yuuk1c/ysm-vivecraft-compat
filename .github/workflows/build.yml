name: Build Mod
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Download dependencies (YSM & Vivecraft)
        run: |
          mkdir -p libs
          # 如果链接失效，请去 Modrinth 复制对应版本的直链替换
          wget -O libs/yes-steve-model.jar "https://cdn.modrinth.com/data/86xjpqqS/versions/1rPJlKDJ/ysm-2.6.5-neoforge%2Bmc26.1-hotfix.jar?mr_download_reason=standalone&mr_loader=neoforge" || echo "YSM download failed, check URL"
          wget -O libs/vivecraft.jar "https://cdn.modrinth.com/data/wGoQDPN5/versions/eZ25nVLw/vivecraft-1.21.1-1.3.8-neoforge.jar?mr_download_reason=standalone&mr_game_version=1.21.1&mr_loader=neoforge" || echo "Vivecraft download failed, check URL"
      
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      
      - name: Build with Gradle
        run: ./gradlew build --refresh-dependencies
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
