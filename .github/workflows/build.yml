name: Build Mod
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Fix repository configuration
        run: |
          # 注释掉有问题的镜像仓库（这里用 sed 在行首添加 // 注释掉整行）
          sed -i "s|maven { url 'https://repo.huaweicloud.com/gradle/gradle' }|// &|" build.gradle
          sed -i "s|maven { url 'https://maven.aliyun.com/repository/central' }|// &|" build.gradle
          sed -i "s|maven { url 'https://maven.aliyun.com/repository/google' }|// &|" build.gradle
          sed -i "s|maven { url 'https://maven.creeperhost.net/' }|// &|" build.gradle
          sed -i "s|maven { url 'https://bmclapi2.bangbang93.com/maven' }|// &|" build.gradle
          sed -i "s|maven { url 'https://neoforged.forgecdn.net/releases' }|// &|" build.gradle
          # 确保保留 NeoForge 和 Maven Central
      
      - name: Download dependencies (YSM & Vivecraft)
        run: |
          mkdir -p libs
          wget -O libs/yes-steve-model.jar "https://cdn.modrinth.com/data/86xjpqqS/versions/1rPJlKDJ/ysm-2.6.5-neoforge%2Bmc26.1-hotfix.jar?mr_download_reason=standalone&mr_loader=neoforge"
          wget -O libs/vivecraft.jar "https://cdn.modrinth.com/data/wGoQDPN5/versions/eZ25nVLw/vivecraft-1.21.1-1.3.8-neoforge.jar?mr_download_reason=standalone&mr_game_version=1.21.1&mr_loader=neoforge"
        # 如果上面的链接失效，请去 Modrinth 找到对应版本的直链替换
      
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      
      - name: Build with Gradle
        run: ./gradlew build
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
